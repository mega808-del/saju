<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes" />
    <title>UI-TEST</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>

    <!-- ═══════════════ Floating Mobile Touch & Pinch-Zoom Toolbar ═══════════════ -->
    <div class="zoom-toolbar" id="zoomToolbar">
        <div class="zoom-toolbar-inner">
            <button type="button" class="zoom-btn" id="btnZoomIn" title="확대">🔍+</button>
            <button type="button" class="zoom-btn" id="btnZoomOut" title="축소">🔍-</button>
            <button type="button" class="zoom-btn" id="btnZoomReset" title="화면 초기화">↺ 리셋</button>
            <span class="zoom-badge" id="zoomScaleBadge">100%</span>
            <span class="toolbar-divider"></span>
            <button type="button" class="font-btn" id="btnFontInc" title="글자 확대">🔤+</button>
            <button type="button" class="font-btn" id="btnFontDec" title="글자 축소">🔤-</button>
            <span class="zoom-badge" id="fontSizeBadge">100%</span>
        </div>
    </div>

    <!-- ═══════════════ Pinch-Zoom Interactive Viewport Container ═══════════════ -->
    <div class="pinch-container" id="pinchContainer">

        <!-- Background Particles -->
        <div class="bg-particles" id="bgParticles"></div>

        <!-- Scroll Progress Bar -->
        <div class="scroll-progress" id="scrollProgress"></div>

        <!-- ═══════════════ Form Section ═══════════════ -->
        <section class="section form-section" id="formSection">
            <div class="form-container">
                <div class="form-deco-top">
                    <span class="deco-bar"></span>
                    <span class="deco-diamond">◆</span>
                    <span class="deco-bar"></span>
                </div>

                <div class="form-header">
                    <div class="logo-badge">
                        <span class="logo-badge-icon">☯</span>
                    </div>
                    <h1 class="form-title">이성효의 명리학</h1>
                    <p class="form-subtitle">사주팔자로 알아보는 나의 운명</p>
                    <div class="title-underline"></div>
                </div>

                <!-- Form -->
                <form class="fortune-form" id="fortuneForm" autocomplete="off">
                    <!-- Name -->
                    <div class="form-group">
                        <label class="form-label" for="userName">
                            <span class="label-icon">👤</span> 이름
                        </label>
                        <input type="text" id="userName" class="form-input" placeholder="이름을 입력하세요" maxlength="20" required />
                        <div class="input-glow"></div>
                    </div>

                    <!-- Gender -->
                    <div class="form-group">
                        <label class="form-label"><span class="label-icon">⚤</span> 성별</label>
                        <div class="gender-toggle" id="genderToggle">
                            <button type="button" class="gender-btn active" data-gender="male">
                                <span class="gender-icon">♂</span><span>남자</span>
                            </button>
                            <button type="button" class="gender-btn" data-gender="female">
                                <span class="gender-icon">♀</span><span>여자</span>
                            </button>
                        </div>
                    </div>

                    <!-- Calendar Type -->
                    <div class="form-group">
                        <label class="form-label"><span class="label-icon">📅</span> 달력 기준</label>
                        <div class="calendar-toggle" id="calendarToggle">
                            <button type="button" class="cal-btn active" data-cal="solar">☀️ 양력</button>
                            <button type="button" class="cal-btn" data-cal="lunar">🌙 음력</button>
                        </div>
                    </div>

                    <!-- Lunar Intercalation (윤달) -->
                    <div class="form-group" id="intercalationGroup" style="display:none;">
                        <label class="form-label"><span class="label-icon">🌓</span> 음력 윤달 (윤월)</label>
                        <label class="lunar-leap-check">
                            <input type="checkbox" id="intercalationToggle" />
                            <span>입력한 음력 달이 윤달(윤월)입니다</span>
                        </label>
                    </div>

                    <!-- Birth Date -->
                    <div class="form-group">
                        <label class="form-label" for="birthDateInput">
                            <span class="label-icon">🎂</span> 생년월일 (직접 입력 또는 달력 선택)
                        </label>
                        <div class="date-dual-wrapper">
                            <input type="text" id="birthDateInput" class="form-input text-date-input" placeholder="YYYY-MM-DD (예: 19950515)" maxlength="10" required />
                            <button type="button" class="btn-yellow-cal" id="btnOpenCalPicker" title="달력으로 생년월일 선택">📅</button>
                            <input type="date" id="birthDateHidden" class="hidden-native-date-picker" min="1900-01-01" max="2035-12-31" />
                        </div>
                        <p class="form-hint" id="calHint">※ 직접 타이핑(예: 19950515) 또는 달력 이미지 클릭 선택</p>
                    </div>

                    <!-- Birth Time -->
                    <div class="form-group">
                        <label class="form-label">
                            <span class="label-icon">🕐</span> 태어난 시간 <span class="label-optional">(선택)</span>
                        </label>
                        <div class="time-grid" id="timeGrid">
                            <button type="button" class="time-btn" data-hour="0"><span class="time-period">23-01</span><span class="time-name">자시</span></button>
                            <button type="button" class="time-btn" data-hour="2"><span class="time-period">01-03</span><span class="time-name">축시</span></button>
                            <button type="button" class="time-btn" data-hour="4"><span class="time-period">03-05</span><span class="time-name">인시</span></button>
                            <button type="button" class="time-btn" data-hour="6"><span class="time-period">05-07</span><span class="time-name">묘시</span></button>
                            <button type="button" class="time-btn" data-hour="8"><span class="time-period">07-09</span><span class="time-name">진시</span></button>
                            <button type="button" class="time-btn" data-hour="10"><span class="time-period">09-11</span><span class="time-name">사시</span></button>
                            <button type="button" class="time-btn" data-hour="12"><span class="time-period">11-13</span><span class="time-name">오시</span></button>
                            <button type="button" class="time-btn" data-hour="14"><span class="time-period">13-15</span><span class="time-name">미시</span></button>
                            <button type="button" class="time-btn" data-hour="16"><span class="time-period">15-17</span><span class="time-name">신시</span></button>
                            <button type="button" class="time-btn" data-hour="18"><span class="time-period">17-19</span><span class="time-name">유시</span></button>
                            <button type="button" class="time-btn" data-hour="20"><span class="time-period">19-21</span><span class="time-name">술시</span></button>
                            <button type="button" class="time-btn" data-hour="22"><span class="time-period">21-23</span><span class="time-name">해시</span></button>
                            <button type="button" class="time-btn time-btn-none active" data-hour=""><span class="time-name">시간 모름</span></button>
                        </div>
                    </div>

                    <!-- 궁합 모드 토글 -->
                    <div class="compatibility-toggle-wrap">
                        <div class="toggle-switch" id="compatModeToggle">
                            <button type="button" class="toggle-btn active" data-mode="single">👤 개인 운세</button>
                            <button type="button" class="toggle-btn" data-mode="couple">💑 궁합 보기</button>
                        </div>
                    </div>

                    <!-- Second Person Fields (궁합 모드) -->
                    <div class="compat-fields" id="compatFields" style="display:none;">
                        <div class="compat-divider">
                            <span class="divider-line"></span>
                            <span class="divider-text">상대방 정보</span>
                            <span class="divider-line"></span>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="userName2"><span class="label-icon">👤</span> 이름</label>
                            <input type="text" id="userName2" class="form-input" placeholder="상대방 이름을 입력하세요" maxlength="20" />
                        </div>
                        <div class="form-group">
                            <label class="form-label"><span class="label-icon">⚤</span> 성별</label>
                            <div class="gender-toggle" id="genderToggle2">
                                <button type="button" class="gender-btn active" data-gender="male"><span class="gender-icon">♂</span><span>남자</span></button>
                                <button type="button" class="gender-btn" data-gender="female"><span class="gender-icon">♀</span><span>여자</span></button>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="birthDateInput2">🎂 생년월일 (직접 입력 또는 달력 선택)</label>
                            <div class="date-dual-wrapper">
                                <input type="text" id="birthDateInput2" class="form-input text-date-input" placeholder="YYYY-MM-DD (예: 19950515)" maxlength="10" />
                                <button type="button" class="btn-yellow-cal" id="btnOpenCalPicker2" title="달력으로 생년월일 선택">📅</button>
                                <input type="date" id="birthDateHidden2" class="hidden-native-date-picker" min="1900-01-01" max="2035-12-31" />
                            </div>
                        </div>
                        <div class="form-group" id="intercalationGroup2" style="display:none;">
                            <label class="form-label"><span class="label-icon">🌓</span> 상대방 음력 윤달 (윤월)</label>
                            <label class="lunar-leap-check">
                                <input type="checkbox" id="intercalationToggle2" />
                                <span>상대방 음력 달이 윤달(윤월)입니다</span>
                            </label>
                        </div>
                        <div class="form-group">
                            <label class="form-label"><span class="label-icon">🕐</span> 태어난 시간 <span class="label-optional">(선택)</span></label>
                            <div class="time-grid" id="timeGrid2">
                                <button type="button" class="time-btn active" data-hour=""><span class="time-name">시간 모름</span></button>
                                <button type="button" class="time-btn" data-hour="0"><span class="time-name">자시(23-01)</span></button>
                                <button type="button" class="time-btn" data-hour="2"><span class="time-name">축시(01-03)</span></button>
                                <button type="button" class="time-btn" data-hour="4"><span class="time-name">인시(03-05)</span></button>
                                <button type="button" class="time-btn" data-hour="6"><span class="time-name">묘시(05-07)</span></button>
                                <button type="button" class="time-btn" data-hour="8"><span class="time-name">진시(07-09)</span></button>
                                <button type="button" class="time-btn" data-hour="10"><span class="time-name">사시(09-11)</span></button>
                                <button type="button" class="time-btn" data-hour="12"><span class="time-name">오시(11-13)</span></button>
                                <button type="button" class="time-btn" data-hour="14"><span class="time-name">미시(13-15)</span></button>
                                <button type="button" class="time-btn" data-hour="16"><span class="time-name">신시(15-17)</span></button>
                                <button type="button" class="time-btn" data-hour="18"><span class="time-name">유시(17-19)</span></button>
                                <button type="button" class="time-btn" data-hour="20"><span class="time-name">술시(19-21)</span></button>
                                <button type="button" class="time-btn" data-hour="22"><span class="time-name">해시(21-23)</span></button>
                            </div>
                        </div>
                    </div>

                    <!-- Submit -->
                    <div class="form-submit-group">
                        <button type="submit" class="btn-submit" id="btnSubmit">
                            <span class="btn-submit-text">🔮 운세 보기</span>
                        </button>
                    </div>

                    <!-- Saved Data Link -->
                    <div class="saved-data-link" id="savedDataLink" style="display:none;">
                        <button type="button" class="btn-saved" id="btnLoadSaved">📂 저장된 운세 불러오기</button>
                    </div>

                    <p class="form-footer-note">※ 사주명리학은 통계에 기반한 참고 문화입니다. 맹신하지 말아주세요.</p>
                </form>
            </div>
        </section>

        <!-- ═══════════════ Result Section ═══════════════ -->
        <section class="section result-section" id="resultSection" style="display:none;">
            <div class="result-container">
                <div class="result-actions">
                    <button class="btn-back" id="btnBack">← 다시 입력하기</button>
                    <div class="result-actions-right">
                        <button class="btn-save-result" id="btnSaveResult">💾 저장</button>
                        <button class="btn-print-result" id="btnPrintResult">🖨️ 인쇄</button>
                    </div>
                </div>

                <div class="profile-card" id="profileCard">
                    <div class="profile-badge">
                        <span class="profile-initials" id="profileInitials">이</span>
                    </div>
                    <div class="profile-info">
                        <h2 class="profile-name" id="profileName">홍길동</h2>
                        <p class="profile-birth" id="profileBirth">2000년 1월 1일</p>
                        <p class="profile-gender" id="profileGender">남자</p>
                    </div>
                    <div class="profile-stamp">
                        <span class="stamp-text">사주</span>
                        <span class="stamp-sub">명리</span>
                    </div>
                </div>

                <div class="section-label reveal">
                    <span class="label-line"></span>
                    <span class="label-text">사주팔자</span>
                    <span class="label-line"></span>
                </div>
                <div class="saju-pillars" id="sajuPillars"></div>

                <div class="section-label reveal">
                    <span class="label-line"></span>
                    <span class="label-text">용신 및 격국 분석</span>
                    <span class="label-line"></span>
                </div>
                <div class="yongshin-section" id="yongshinSection"></div>

                <div class="section-label reveal">
                    <span class="label-line"></span>
                    <span class="label-text">대운</span>
                    <span class="label-line"></span>
                </div>
                <div class="daewoon-section" id="daewoonSection"></div>

                <div class="section-label reveal">
                    <span class="label-line"></span>
                    <span class="label-text">오행 분석</span>
                    <span class="label-line"></span>
                </div>
                <div class="ohaeng-section" id="ohaengSection"></div>

                <div class="section-label reveal">
                    <span class="label-line"></span>
                    <span class="label-text">십성 분석</span>
                    <span class="label-line"></span>
                </div>
                <div class="sipseong-section" id="sipseongSection"></div>

                <div class="section-label reveal">
                    <span class="label-line"></span>
                    <span class="label-text">성격 및 특성</span>
                    <span class="label-line"></span>
                </div>
                <div class="character-card reveal" id="characterCard"></div>

                <div class="section-label reveal">
                    <span class="label-line"></span>
                    <span class="label-text">12운성 · 12신살 · 형충파해</span>
                    <span class="label-line"></span>
                </div>
                <div class="extra-analysis-section" id="extraAnalysisSection"></div>

                <div id="compatResultContainer" style="display:none;">
                    <div class="section-label reveal">
                        <span class="label-line"></span>
                        <span class="label-text">궁합 분석</span>
                        <span class="label-line"></span>
                    </div>
                    <div class="compatibility-section" id="compatResultSection"></div>
                </div>

                <div class="section-label reveal">
                    <span class="label-line"></span>
                    <span class="label-text">연도별 운세</span>
                    <span class="label-line"></span>
                </div>

                <div class="year-nav" id="yearNav"></div>
                <div class="yearly-fortune" id="yearlyFortune"></div>

                <div class="result-footer">
                    <div class="footer-divider"><span class="footer-diamond">◇</span></div>
                    <p class="footer-text">이성효의 명리학 · 사주팔자는 참고용입니다</p>
                    <p class="footer-copy">© 2026 이성효의 명리학</p>
                </div>
            </div>
        </section>
    </div>

    <!-- Toast Notification -->
    <div class="toast-container" id="toastContainer"></div>

    <pre id="uitestOut" style="display:none;"></pre>

    <script src="https://cdn.jsdelivr.net/npm/korean-lunar-calendar@0.4.0/dist/korean-lunar-calendar.min.js"></script>
    <script src="pinch-zoom.js"></script>
    <script src="saju-engine.js"></script>
    <script src="script.js"></script>
    <script>
    (function(){
        const R = [];
        function rec(k, ok, msg){ R.push((ok ? 'PASS' : 'FAIL') + '|' + k + '|' + msg); console.log('[UITEST] ' + R[R.length-1]); }
        const $ = s => document.querySelector(s);
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        async function run(){
            try {
                // A: 잘못된 날짜 차단
                $('#userName').value = '테스트';
                $('#birthDateInput').value = '2023-02-30';
                $('#fortuneForm').requestSubmit();
                await sleep(300);
                const toastA = !!$('.toast');
                const formVisibleA = getComputedStyle($('#formSection')).display !== 'none';
                rec('A_잘못된날짜차단', toastA && formVisibleA, 'toast=' + toastA + ' resultSection=' + (getComputedStyle($('#resultSection')).display !== 'none'));

                // B1: 음력 변환 (윤달 없음) + 윤달 UI 표시
                $('#userName').value = '테스트';
                $('#birthDateInput').value = '2023-02-15';
                document.querySelector('#calendarToggle .cal-btn[data-cal="lunar"]').click();
                await sleep(100);
                const leapVisible = getComputedStyle($('#intercalationGroup')).display !== 'none';
                $('#intercalationToggle').checked = false;
                $('#fortuneForm').requestSubmit();
                await sleep(400);
                const birthB1 = $('#profileBirth').textContent;
                rec('B1_윤달UI표시', leapVisible, '윤달 입력란 표시=' + leapVisible);
                rec('B1_음력변환', birthB1.indexOf('2023년 3월 6일') !== -1, birthB1);

                // B2: 윤달 변환 (윤2월 15일)
                $('#btnBack').click();
                await sleep(150);
                $('#userName').value = '테스트';
                $('#birthDateInput').value = '2023-02-15';
                document.querySelector('#calendarToggle .cal-btn[data-cal="lunar"]').click();
                await sleep(100);
                $('#intercalationToggle').checked = true;
                $('#fortuneForm').requestSubmit();
                await sleep(400);
                const birthB2 = $('#profileBirth').textContent;
                rec('B2_윤달변환', birthB2.indexOf('2023년 4월 5일') !== -1 && birthB2.indexOf('(윤)') !== -1, birthB2);

                // C: 양력 A 케이스
                $('#btnBack').click();
                await sleep(150);
                $('#userName').value = '테스트';
                $('#birthDateInput').value = '1992-03-04';
                document.querySelector('#calendarToggle .cal-btn[data-cal="solar"]').click();
                await sleep(100);
                document.querySelector('#timeGrid .time-btn[data-hour="10"]').click();
                $('#fortuneForm').requestSubmit();
                await sleep(500);
                const pillars = $('#sajuPillars').innerText.replace(/\s+/g, ' ').trim();
                const yd = $('#yongshinSection').innerText;
                const adviceEl = $('#ohaengSection .ohaeng-advice');
                const extra = $('#extraAnalysisSection').innerText;
                const yearText = $('#yearlyFortune').innerText;
                // 앱은 지지를 한글(신/인/묘/사)로 표시 - 8자 순서로 검증
                const pSeq = ['壬','신','壬','인','己','묘','己','사'].every(ch => pillars.indexOf(ch) !== -1);
                rec('C_사주팔자', pSeq, pillars);
                rec('C_용신동적해설', yd.indexOf('己의 기운이') !== -1, yd.replace(/\n/g, ' ').substring(0, 70));
                rec('C_오행조언', !!adviceEl && adviceEl.textContent.trim().length > 10, adviceEl ? adviceEl.textContent.trim().substring(0, 55) : '없음');
                rec('C_12운성신살해설', extra.indexOf('해설') !== -1, '렌더링 OK');
                rec('C_연도별운세', yearText.indexOf('丙') !== -1 && yearText.indexOf('2026년') !== -1, '15년 카드 OK');
                // 재제출 중복 리스너 확인: 두 번째 제출 후 연도 버튼 클릭이 정상 동작하는지
                $('#btnBack').click();
                await sleep(150);
                $('#userName').value = '테스트';
                $('#birthDateInput').value = '1999-11-20';
                document.querySelector('#timeGrid .time-btn[data-hour="18"]').click();
                $('#fortuneForm').requestSubmit();
                await sleep(500);
                const navBtn = document.querySelector('#yearNav .year-nav-btn[data-index="3"]');
                navBtn.click();
                await sleep(300);
                const firstCard = document.querySelector('#yearlyFortune .fortune-year-card');
                rec('C_연도탭중복', !!firstCard, '재제출 후 탭 클릭 정상=' + !!firstCard);

                // D: 궁합 모드
                $('#btnBack').click();
                await sleep(150);
                document.querySelector('#compatModeToggle .toggle-btn[data-mode="couple"]').click();
                await sleep(100);
                $('#userName').value = '김하늘';
                $('#birthDateInput').value = '1992-03-04';
                $('#userName2').value = '박별';
                $('#birthDateInput2').value = '1999-11-20';
                document.querySelector('#timeGrid2 .time-btn[data-hour="18"]').click();
                $('#fortuneForm').requestSubmit();
                await sleep(500);
                const compatVisible = getComputedStyle($('#compatResultContainer')).display !== 'none';
                rec('D_궁합분석', compatVisible && $('#compatResultSection').innerText.length > 50, compatVisible ? '궁합 결과 렌더링 OK' : '궁합 미표시');

                // E: 저장 → 복원
                $('#btnSaveResult').click();
                await sleep(150);
                $('#btnBack').click();
                await sleep(150);
                document.querySelector('#compatModeToggle .toggle-btn[data-mode="single"]').click();
                await sleep(100);
                $('#btnLoadSaved').click();
                await sleep(300);
                const nameR = $('#userName').value === '김하늘';
                const dateR = $('#birthDateInput').value === '1992-03-04';
                const compatR = getComputedStyle($('#compatFields')).display !== 'none';
                const name2R = $('#userName2').value === '박별';
                rec('E_저장복원', nameR && dateR && compatR && name2R, 'name=' + $('#userName').value + ' date=' + $('#birthDateInput').value + ' compat=' + compatR + ' name2=' + $('#userName2').value);

                // F: 궁합 + 음력 + 상대방만 윤달 구분 (본인 정월 2/15 → 3/6, 상대 윤2/15 → 4/5)
                $('#btnBack').click();
                await sleep(150);
                document.querySelector('#compatModeToggle .toggle-btn[data-mode="couple"]').click();
                await sleep(100);
                document.querySelector('#calendarToggle .cal-btn[data-cal="lunar"]').click();
                await sleep(100);
                $('#userName').value = '김하늘';
                $('#birthDateInput').value = '2023-02-15';
                $('#intercalationToggle').checked = false;
                $('#userName2').value = '박별';
                $('#birthDateInput2').value = '2023-02-15';
                $('#intercalationToggle2').checked = true;
                $('#fortuneForm').requestSubmit();
                await sleep(500);
                const s1 = _lastResult.result.solarDate;
                const s2 = _lastResult.compat.result.solarDate;
                rec('F_궁합윤달구분', s1.month === 3 && s1.day === 6 && s2.month === 4 && s2.day === 5,
                    '본인=' + s1.year + '-' + s1.month + '-' + s1.day + ' 상대(윤)=' + s2.year + '-' + s2.month + '-' + s2.day);
            } catch (e) {
                rec('EXCEPTION', false, e.message + ' | ' + (e.stack || '').split('\n')[0]);
            }
            const pass = R.filter(r => r.startsWith('PASS')).length;
            const fail = R.filter(r => r.startsWith('FAIL')).length;
            document.title = 'UITEST|P' + pass + 'F' + fail + '|' + R.join('~');
            $('#uitestOut').textContent = R.join('\n');
        }
        document.addEventListener('DOMContentLoaded', () => setTimeout(run, 600));
    })();
    </script>
</body>
</html>
